plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.callmailer'
    compileSdk 34

    defaultConfig {
        applicationId "com.callmailer"
        minSdk 26
        targetSdk 34
        def bn = System.getenv("BUILD_NUMBER")
        versionCode bn != null ? bn.toInteger() : 1
        versionName bn != null ? bn : "dev"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
            if (keystoreBase64) {
                def keystoreFile = new File(buildDir, "release.keystore")
                keystoreFile.bytes = Base64.getMimeDecoder().decode(keystoreBase64)
                storeFile keystoreFile
                storePassword System.getenv("KEY_STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig System.getenv("KEYSTORE_BASE64") ? signingConfigs.release : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md',
                'META-INF/NOTICE.md',
                'META-INF/NOTICE-notice.md',
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}